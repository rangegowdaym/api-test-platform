# Shared approval UI with a Postgres audit trail. The repo is mounted so cases are read/written in Git.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: apitest, POSTGRES_USER: apitest, POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}" }
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
  approval-ui:
    build: .
    depends_on: [ db ]
    ports: [ "8080:8080" ]
    environment:
      PLATFORM_USERS: "${PLATFORM_USERS:?set PLATFORM_USERS=name:password:REVIEWER}"
      BIND_ADDRESS: 0.0.0.0            # inside the container; the host port mapping decides who can reach it
      DB_URL: jdbc:postgresql://db:5432/apitest
      DB_USER: apitest
      DB_PASSWORD: "${DB_PASSWORD}"
    volumes: [ ".:/workspace" ]
volumes:
  pgdata: {}
