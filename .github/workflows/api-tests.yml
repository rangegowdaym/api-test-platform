name: api-tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 1 * * *"          # nightly regression, 01:17 UTC
  workflow_dispatch:
    inputs:
      env: { description: "Environment", default: "qa", required: true }
      tags: { description: "Cucumber tag expression", default: "@smoke", required: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: Build and platform unit tests
        run: mvn -B -q test -Punit && mvn -B -q -DskipTests package
      - uses: actions/upload-artifact@v4
        with: { name: jar, path: target/api-test-platform.jar }

  # When a spec changes on a PR: regenerate cases so reviewers see new/changed ones as PENDING_REVIEW in the UI.
  regenerate-cases:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/download-artifact@v4
        with: { name: jar, path: target }
      - name: Regenerate for changed specs
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- specs/ || true)
          for f in $CHANGED; do [ -f "$f" ] && java -jar target/api-test-platform.jar generate --spec "$f"; done
          java -jar target/api-test-platform.jar status
          git diff --stat testcases/ || true

  api-tests:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env || 'qa' }}
    permissions:
      contents: read
      models: read          # lets GITHUB_TOKEN call GitHub Models for the RCA narrative
    env:
      ENV: ${{ github.event.inputs.env || 'qa' }}
      TAGS: ${{ github.event.inputs.tags || (github.event_name == 'schedule' && 'not @wip' || '@smoke') }}
      QA_API_TOKEN: ${{ secrets.QA_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLM_PROVIDER: github-models
      LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-4.1' }}
      LLM_ENABLED: ${{ vars.LLM_ENABLED || 'false' }}
      RUN_ID: gh-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: actions/download-artifact@v4
        with: { name: jar, path: target }
      - name: Restore run history (flaky / new-failure detection)
        uses: actions/cache@v4
        with:
          path: history
          key: history-${{ env.ENV }}-${{ github.run_number }}
          restore-keys: history-${{ env.ENV }}-
      - name: Features from approved cases
        run: java -jar target/api-test-platform.jar features
      - name: Run tests + RCA + report
        id: run
        run: ./scripts/run-tests.sh "$ENV" "$TAGS"
      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report-${{ env.ENV }}-${{ github.run_number }}
          path: |
            reports/
            target/rca/
            target/run-summary.json
            target/evidence/
      - name: Job summary
        if: always()
        run: |
          echo "### API tests ($ENV, $TAGS)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.summary' target/summary.json >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.entries[:10][] | "- **\(.category)** \(.summary) (owner: \(.owner))"' target/rca/rca.json >> "$GITHUB_STEP_SUMMARY" || true
