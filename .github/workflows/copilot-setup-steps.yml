# Prepares the environment for the Copilot cloud agent before it starts work on an issue or PR.
# The job MUST be named copilot-setup-steps. Must be on the default branch.
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: Download dependencies and build the jar
        run: |
          mvn -B -q dependency:go-offline
          mvn -B -q -DskipTests package
      - name: Tools used by scripts and the guard hook
        run: python3 --version && jq --version
