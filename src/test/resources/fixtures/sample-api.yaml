# Unit-test fixture for the platform (mvn test -Punit). Not called over the network; not a real API.
openapi: 3.0.3
info:
  title: Sample Orders API (test fixture)
  version: 1.0.0
servers:
  - url: https://sample.invalid/api/v1
tags:
  - name: orders
  - name: customers
security:
  - bearerAuth: []
paths:
  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewOrder' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: Invalid input }
        '401': { description: Unauthorized }
    get:
      tags: [orders]
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [open, paid, cancelled]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '400': { description: Invalid status }
        '401': { description: Unauthorized }
  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [orders]
      operationId: getOrderById
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { description: Unauthorized }
        '404': { description: Not found }
    delete:
      tags: [orders]
      operationId: cancelOrder
      responses:
        '200': { description: Cancelled }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /customers:
    post:
      tags: [customers]
      operationId: createCustomer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Customer' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '422': { description: Validation error }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    NewOrder:
      type: object
      required: [customerId, items]
      properties:
        customerId: { type: string, minLength: 3, maxLength: 20, example: CUST-001 }
        items:
          type: array
          items: { type: string }
        channel: { type: string, enum: [web, store, phone] }
    Order:
      allOf:
        - $ref: '#/components/schemas/NewOrder'
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }
    Customer:
      type: object
      required: [name, age]
      properties:
        name: { type: string, example: Asha }
        age: { type: integer, minimum: 18, maximum: 120 }
        email: { type: string, format: email }
