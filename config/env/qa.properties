# ===== QA environment =====  (-Denv=qa is the default)
# Fill in the values for YOUR API. Secrets: write ${ENV_VAR_NAME} and export the variable (locally) or set it as a
# CI secret. Never commit real values.

# Base URL used for every OpenAPI tag. Override one tag with baseUri.<tag>=... (tag as in your spec, e.g. baseUri.orders)
baseUri=https://petstore3.swagger.io/api/v3
# baseUri.orders=https://orders.qa.example.com/api/v1

# optional: GET this path once before the first scenario; a 5xx marks the environment unhealthy
health.path=

http.connectTimeoutMs=10000
http.readTimeoutMs=30000
# log every request/response line (method, path, status, time)
http.log=false

# ----- company network (leave commented when the API is reachable directly) -----
# Check everything with:  java -jar target/api-test-platform.jar doctor --env <env>
# Corporate proxy (ask IT, or take it from your browser / PAC file). Hosts in nonProxyHosts go direct.
# http.proxy.host=proxy.company.com
# http.proxy.port=8080
# http.proxy.scheme=http
# http.proxy.user=${PROXY_USER}
# http.proxy.password=${PROXY_PASSWORD}
# http.proxy.nonProxyHosts=localhost|127.0.0.1|*.company.internal
# Company root CA, fixes "PKIX path building failed" (see config/certs/README.md):
# tls.trustStore=config/certs/company-truststore.p12
# tls.trustStorePassword=${TRUSTSTORE_PASSWORD}
# Client certificate, when the API gateway requires mutual TLS:
# tls.keyStore=config/certs/client.p12
# tls.keyStorePassword=${CLIENT_CERT_PASSWORD}
# Last resort for a certificate without the host name (avoid):
# tls.allowAllHostnames=false
# Trust ANY certificate: dev sandboxes only, refused for environment names containing prod/prd/live:
# tls.relaxed=false
# Headers on every request (gateway subscription keys, tracing). ${uuid} = a new id per request.
# A test case's own header with the same name wins.
# http.header.X-Correlation-Id=${uuid}
# http.header.Ocp-Apim-Subscription-Key=${APIM_SUBSCRIPTION_KEY}

# ----- auth profiles: test cases use "auth": "default" for secured endpoints -----
# type = oauth2 | bearer | apikey | basic | none
# Petstore sandbox header auth; export QA_API_KEY=special-key (public documented test key)
auth.default.type=apikey
auth.default.header=api_key
auth.default.key=special-key
#auth.default.key=${QA_API_KEY}
# auth.default.type=bearer
# auth.default.token=${QA_API_TOKEN}
# auth.default.type=oauth2
# auth.default.tokenUrl=https://auth.qa.example.com/oauth2/token
# auth.default.clientId=${QA_CLIENT_ID}
# auth.default.clientSecret=${QA_CLIENT_SECRET}
# auth.default.scope=read write
# auth.default.type=apikey
# auth.default.header=X-API-Key
# auth.default.key=${QA_API_KEY}

# ----- test data for ${testdata.<name>} placeholders: one line per path id in your spec -----
# The spec audit (/generate-tests) lists the keys your spec needs. Example:
testdata.petId=1
testdata.orderId=1
testdata.username=user1
# testdata.customerId=CUST-001
